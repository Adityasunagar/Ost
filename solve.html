<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <style>
    .hero {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      padding: 100px 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MySite</a>
  </div>
</nav>

<!-- Hero Section -->
<section class="hero">
  <h1>Welcome to My Portfolio</h1>
  <p>This is a simple Bootstrap example with custom CSS.</p>
  <a href="#about" class="btn btn-light btn-lg">Learn More</a>
</section>

<!-- About Section -->
<section id="about" class="container mt-5">
  <h2>About Me</h2>
  <p>This section talks about who I am and what I do.</p>
</section>

<!-- Bootstrap JS (optional if you use dropdowns, modals, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
